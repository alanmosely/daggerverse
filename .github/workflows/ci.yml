name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  DAGGER_VERSION: "0.21.8"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install ruff
        run: pipx install ruff==0.16.5
      - name: Lint module sources
        run: ruff check dagger/src esp-idf/src esp-adf-docker/dagger/src

  modules:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: daggerverse
            dir: .
            check: release
            # cheap self-tests: run on every push/PR
            run_checks: true
          - module: esp-idf
            dir: esp-idf
            check: build
            # its check is a full firmware build: runs in e2e-build instead
            run_checks: false
          - module: esp-adf-docker
            dir: esp-adf-docker
            check: publish
            run_checks: true
    name: modules (${{ matrix.module }})
    steps:
      - uses: actions/checkout@v5
      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | BIN_DIR="$HOME/.local/bin" DAGGER_VERSION="$DAGGER_VERSION" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Module loads and lists functions
        working-directory: ${{ matrix.dir }}
        run: dagger functions --progress plain
      - name: Function signature resolves
        working-directory: ${{ matrix.dir }}
        run: dagger call ${{ matrix.check }} --help --progress plain
      - name: Checks are registered
        working-directory: ${{ matrix.dir }}
        run: dagger check -l --progress plain
      - name: Run module checks
        if: ${{ matrix.run_checks }}
        working-directory: ${{ matrix.dir }}
        run: dagger check --progress plain

  e2e-build:
    # esp-idf's self-test check is a full hello-world firmware build with
    # artifact assertions; heavier, so skip PRs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Dagger CLI
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh \
            | BIN_DIR="$HOME/.local/bin" DAGGER_VERSION="$DAGGER_VERSION" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run esp-idf module checks (full hello-world build)
        working-directory: esp-idf
        run: dagger check --progress plain
